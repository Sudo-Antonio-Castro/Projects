<script>
const labData = {"prompt":"student@lab:~$","scenarios":[{"title":"Scenario 1 • File and directory setup","summary":"Stand up a project workspace and move starter files into place.","steps":[{"commandName":"pwd","target":"Display the current working directory.","expected":"pwd","hint":"print the present working directory","output":"/home/student","accepted":["pwd"]},{"commandName":"ls","target":"List the files in the current directory.","expected":"ls","hint":"basic directory listing","output":"Documents  Downloads  lab  scripts","accepted":["ls","ls .","dir","dir ."]},{"commandName":"cd","target":"Change into the lab workspace.","expected":"cd lab","hint":"switch into the lab folder","output":"/home/student/lab","accepted":["cd lab","cd ./lab","cd ~/lab","cd /home/student/lab"],"promptAfter":"student@lab:~/lab$"},{"commandName":"mkdir","target":"Create a new directory named reports.","expected":"mkdir reports","hint":"make a single directory","output":"Created directory: reports","accepted":["mkdir reports","mkdir ./reports","mkdir -p reports","mkdir -p ./reports","install -d reports"]},{"commandName":"touch","target":"Create an empty file called inventory.txt.","expected":"touch inventory.txt","hint":"create an empty file","output":"Created file: inventory.txt","accepted":["touch inventory.txt","touch ./inventory.txt","> inventory.txt",": > inventory.txt","truncate -s 0 inventory.txt"]},{"commandName":"cp","target":"Copy inventory.txt to inventory.bak.","expected":"cp inventory.txt inventory.bak","hint":"copy source to backup file","output":"Copied inventory.txt to inventory.bak","accepted":["cp inventory.txt inventory.bak","cp ./inventory.txt ./inventory.bak","cp -p inventory.txt inventory.bak"]},{"commandName":"mv","target":"Rename inventory.bak to inventory-archive.txt.","expected":"mv inventory.bak inventory-archive.txt","hint":"move or rename the backup file","output":"Renamed inventory.bak to inventory-archive.txt","accepted":["mv inventory.bak inventory-archive.txt","mv ./inventory.bak ./inventory-archive.txt"]}],"initialPrompt":"student@lab:~$"},{"title":"Scenario 2 • Inspect and search text","summary":"Read config data and locate the line you care about quickly.","steps":[{"commandName":"cat","target":"Display the contents of inventory-archive.txt.","expected":"cat inventory-archive.txt","hint":"dump the file to stdout","output":"inventory-archive.txt\n---\nweb01\ndb01\nbackup01","accepted":["cat inventory-archive.txt","cat ./inventory-archive.txt","less inventory-archive.txt","more inventory-archive.txt"]},{"commandName":"head","target":"Show the first five lines of /etc/passwd.","expected":"head -n 5 /etc/passwd","hint":"read only the first part of the file","output":"root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\n...","accepted":["head -n 5 /etc/passwd","head -5 /etc/passwd","head --lines=5 /etc/passwd"]},{"commandName":"tail","target":"Show the last 20 lines of /var/log/syslog.","expected":"tail -n 20 /var/log/syslog","hint":"read the end of the log","output":"Apr 13 09:41:07 web01 sshd[4271]: Accepted publickey for analyst","accepted":["tail -n 20 /var/log/syslog","tail -20 /var/log/syslog","tail --lines=20 /var/log/syslog"]},{"commandName":"grep","target":"Search /var/log/auth.log for SSH entries, case-insensitive.","expected":"grep -i ssh /var/log/auth.log","hint":"filter for a pattern in the auth log","output":"Apr 13 09:45:01 web01 sshd[4290]: Connection closed","accepted":["grep -i ssh /var/log/auth.log","grep -i 'ssh' /var/log/auth.log","grep -i \"ssh\" /var/log/auth.log","grep --ignore-case ssh /var/log/auth.log","grep -in ssh /var/log/auth.log"]},{"commandName":"find","target":"Find every .conf file under /etc.","expected":"find /etc -name \"*.conf\"","hint":"search recursively by name","output":"/etc/ssh/ssh_config\n/etc/sysctl.conf\n/etc/resolv.conf","accepted":["find /etc -name \"*.conf\"","find /etc -name '*.conf'","find /etc -name \\*.conf","find /etc -iname \"*.conf\"","find /etc -iname '*.conf'"]},{"commandName":"less","target":"Open /etc/fstab in a pager.","expected":"less /etc/fstab","hint":"use a pager to scroll the file","output":"Opened /etc/fstab in less","accepted":["less /etc/fstab","more /etc/fstab"]},{"commandName":"man","target":"Open the manual page for tar.","expected":"man tar","hint":"consult the built-in manual","output":"Displayed manual page for tar","accepted":["man tar","man 1 tar","info tar"]}],"initialPrompt":"student@lab:~/lab$"},{"title":"Scenario 3 • Ownership and identity","summary":"Lock down a file and prepare a new analyst account.","steps":[{"commandName":"chmod","target":"Set inventory-archive.txt to mode 640.","expected":"chmod 640 inventory-archive.txt","hint":"set rw-r----- permissions","output":"Permissions set to 640 on inventory-archive.txt","accepted":["chmod 640 inventory-archive.txt","chmod 0640 inventory-archive.txt","chmod u=rw,g=r,o= inventory-archive.txt"]},{"commandName":"chown","target":"Change the owner and group to root:root.","expected":"chown root:root inventory-archive.txt","hint":"owner colon group","output":"Owner changed to root:root","accepted":["chown root:root inventory-archive.txt","chown root.root inventory-archive.txt","sudo chown root:root inventory-archive.txt","sudo chown root.root inventory-archive.txt"]},{"commandName":"chgrp","target":"Change the group to adm.","expected":"chgrp adm inventory-archive.txt","hint":"change only the group","output":"Group changed to adm","accepted":["chgrp adm inventory-archive.txt","sudo chgrp adm inventory-archive.txt","chown :adm inventory-archive.txt","sudo chown :adm inventory-archive.txt"]},{"commandName":"useradd","target":"Create a local user named analyst.","expected":"useradd analyst","hint":"create a new local account","output":"User analyst created","accepted":["useradd analyst","sudo useradd analyst","adduser analyst","sudo adduser analyst"]},{"commandName":"passwd","target":"Assign a password to analyst.","expected":"passwd analyst","hint":"set the user password","output":"passwd: password updated successfully","accepted":["passwd analyst","sudo passwd analyst"]},{"commandName":"usermod","target":"Add analyst to the sudo group.","expected":"usermod -aG sudo analyst","hint":"append the user to a supplemental group","output":"analyst added to groups: analyst sudo","accepted":["usermod -aG sudo analyst","usermod -a -G sudo analyst","sudo usermod -aG sudo analyst","sudo usermod -a -G sudo analyst","gpasswd -a analyst sudo","sudo gpasswd -a analyst sudo","adduser analyst sudo","sudo adduser analyst sudo"]},{"commandName":"id","target":"Display the identity information for analyst.","expected":"id analyst","hint":"show UID, GID, and groups","output":"uid=1002(analyst) gid=1002(analyst) groups=1002(analyst),27(sudo)","accepted":["id analyst","id -a analyst"]}],"initialPrompt":"student@lab:~/lab$"},{"title":"Scenario 4 • Processes and services","summary":"Inspect workloads, adjust priority, and verify a service restart.","steps":[{"commandName":"ps","target":"List running processes in a full-format view.","expected":"ps aux","hint":"classic process snapshot with all users","output":"root      1  0.0  0.1  22500  9500 ?        Ss   08:00   0:02 /sbin/init","accepted":["ps aux","ps axu","ps -ef","ps -eF","ps -aux"]},{"commandName":"top","target":"Open a real-time process monitor.","expected":"top","hint":"interactive process monitor","output":"top - 09:51:02 up 2 days,  3 users,  load average: 0.20, 0.18, 0.12","accepted":["top","htop"]},{"commandName":"kill","target":"Terminate process ID 4242.","expected":"kill 4242","hint":"send the default TERM signal","output":"Signal sent to PID 4242","accepted":["kill 4242","kill -15 4242","kill -TERM 4242","kill -s TERM 4242"]},{"commandName":"systemctl","target":"Check the status of the ssh service.","expected":"systemctl status ssh","hint":"query a systemd unit","output":"ssh.service - OpenBSD Secure Shell server\nActive: active (running)","accepted":["systemctl status ssh","systemctl status ssh.service","sudo systemctl status ssh","sudo systemctl status ssh.service","service ssh status","sudo service ssh status"]},{"commandName":"journalctl","target":"Show the last 20 journal lines for ssh.","expected":"journalctl -u ssh -n 20","hint":"read service logs from the journal","output":"Apr 13 09:52:10 web01 sshd[4301]: Server listening on 0.0.0.0 port 22.","accepted":["journalctl -u ssh -n 20","journalctl -n 20 -u ssh","journalctl --unit ssh --lines 20","journalctl --unit=ssh --lines=20","journalctl -u ssh.service -n 20","sudo journalctl -u ssh -n 20"]},{"commandName":"history","target":"Display your command history.","expected":"history","hint":"show the shell history list","output":"101  pwd\n102  ls\n103  cd lab\n104  history","accepted":["history","fc -l"]},{"commandName":"nice","target":"Start backup.sh with a niceness of 10.","expected":"nice -n 10 ./backup.sh","hint":"launch a process with lower priority","output":"Started ./backup.sh with niceness 10","accepted":["nice -n 10 ./backup.sh","nice -10 ./backup.sh","nice --adjustment=10 ./backup.sh","nice -n 10 backup.sh","nice -n 10 bash backup.sh"]}],"initialPrompt":"student@lab:~$"},{"title":"Scenario 5 • Network diagnostics","summary":"Verify interfaces, listeners, and outbound connectivity.","steps":[{"commandName":"ip","target":"Display IP address information for all interfaces.","expected":"ip addr","hint":"show interface addressing","output":"2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500\n    inet 192.168.10.24/24","accepted":["ip addr","ip address","ip a","ip addr show","ip address show","ifconfig -a"]},{"commandName":"ss","target":"Show listening TCP and UDP sockets with process info.","expected":"ss -tulpn","hint":"socket statistics replacement for netstat","output":"tcp LISTEN 0 128 0.0.0.0:22 0.0.0.0:* users:((\"sshd\",pid=912,fd=3))","accepted":["ss -tulpn","ss -lntup","ss -tunlp","ss -lntu -p","ss --tcp --udp --listening --processes --numeric"]},{"commandName":"ping","target":"Send four ICMP echo requests to 8.8.8.8.","expected":"ping -c 4 8.8.8.8","hint":"limit to four packets","output":"4 packets transmitted, 4 received, 0% packet loss","accepted":["ping -c 4 8.8.8.8","ping -c4 8.8.8.8","ping --count 4 8.8.8.8"]},{"commandName":"traceroute","target":"Trace the route to example.com.","expected":"traceroute example.com","hint":"map the hop path","output":"1  gateway (192.168.10.1)  1.103 ms\n2  10.1.0.1  4.281 ms\n...","accepted":["traceroute example.com","tracepath example.com"]},{"commandName":"curl","target":"Fetch only the HTTP headers for https://example.com.","expected":"curl -I https://example.com","hint":"issue a HEAD-style request","output":"HTTP/2 200\ncontent-type: text/html; charset=UTF-8","accepted":["curl -I https://example.com","curl -I https://example.com/","curl --head https://example.com","curl --head https://example.com/","curl -sI https://example.com"]},{"commandName":"wget","target":"Download https://example.com.","expected":"wget https://example.com","hint":"retrieve the remote page to a file","output":"Saving to: index.html\nindex.html saved [1256/1256]","accepted":["wget https://example.com","wget https://example.com/","curl -O https://example.com","curl -LO https://example.com"]},{"commandName":"hostnamectl","target":"Show the host identity details.","expected":"hostnamectl","hint":"display hostname and OS metadata","output":"Static hostname: web01\nOperating System: Ubuntu 24.04 LTS","accepted":["hostnamectl","hostnamectl status"]}],"initialPrompt":"student@lab:~$"},{"title":"Scenario 6 • Storage and archive work","summary":"Inventory disks, review usage, and package a log bundle.","steps":[{"commandName":"lsblk","target":"List block devices and mount points.","expected":"lsblk","hint":"show disk and partition layout","output":"sda      8:0    0  80G  0 disk\n├─sda1   8:1    0   1G  0 part /boot\n└─sda2   8:2    0  79G  0 part /","accepted":["lsblk","lsblk -f","lsblk -o NAME,SIZE,TYPE,MOUNTPOINTS"]},{"commandName":"fdisk","target":"Print the partition table for all disks.","expected":"fdisk -l","hint":"lowercase ell option","output":"Disk /dev/sda: 80 GiB, 85899345920 bytes, 167772160 sectors","accepted":["fdisk -l","fdisk --list","sudo fdisk -l","sudo fdisk --list"]},{"commandName":"df","target":"Display filesystem capacity in human-readable units.","expected":"df -h","hint":"disk free in human format","output":"Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda2        79G   22G   54G  29% /","accepted":["df -h","df --human-readable"]},{"commandName":"du","target":"Summarize the size of /var/log.","expected":"du -sh /var/log","hint":"single summary, human-readable","output":"184M\t/var/log","accepted":["du -sh /var/log","du -hs /var/log","du --summarize --human-readable /var/log"]},{"commandName":"tar","target":"Create a gzip tar archive named logs.tar.gz from /var/log.","expected":"tar -czf logs.tar.gz /var/log","hint":"create, gzip, file","output":"Created archive logs.tar.gz","accepted":["tar -czf logs.tar.gz /var/log","tar -zcf logs.tar.gz /var/log","tar czf logs.tar.gz /var/log","tar zcf logs.tar.gz /var/log","tar --create --gzip --file=logs.tar.gz /var/log","tar -czvf logs.tar.gz /var/log"]},{"commandName":"zip","target":"Create a zip archive named reports.zip from the reports directory.","expected":"zip -r reports.zip reports","hint":"recursive zip creation","output":"adding: reports/ (stored 0%)","accepted":["zip -r reports.zip reports","zip -r reports.zip reports/","zip --recurse-paths reports.zip reports"]},{"commandName":"unzip","target":"Extract docs.zip into the current directory.","expected":"unzip docs.zip","hint":"expand a zip archive","output":"Archive: docs.zip\n  inflating: README.txt","accepted":["unzip docs.zip","unzip ./docs.zip","unzip docs.zip -d ."]}],"initialPrompt":"student@lab:~$"},{"title":"Scenario 7 • Mounting and editor tasks","summary":"Work with removable storage, scheduled jobs, and quick edits.","steps":[{"commandName":"mount","target":"Mount /dev/sdb1 at /mnt/usb.","expected":"mount /dev/sdb1 /mnt/usb","hint":"device then mount point","output":"Mounted /dev/sdb1 on /mnt/usb","accepted":["mount /dev/sdb1 /mnt/usb","sudo mount /dev/sdb1 /mnt/usb"]},{"commandName":"umount","target":"Unmount /mnt/usb.","expected":"umount /mnt/usb","hint":"remove the filesystem from the mount table","output":"Unmounted /mnt/usb","accepted":["umount /mnt/usb","sudo umount /mnt/usb","umount /dev/sdb1","sudo umount /dev/sdb1"]},{"commandName":"crontab","target":"Edit the current user crontab.","expected":"crontab -e","hint":"open the cron table in an editor","output":"Opened user crontab for editing","accepted":["crontab -e","EDITOR=nano crontab -e","VISUAL=nano crontab -e"]},{"commandName":"nano","target":"Edit /etc/hosts with nano.","expected":"nano /etc/hosts","hint":"launch the simple terminal editor","output":"Opened /etc/hosts in nano","accepted":["nano /etc/hosts","sudo nano /etc/hosts"]},{"commandName":"vi","target":"Open /etc/fstab with vi.","expected":"vi /etc/fstab","hint":"classic modal editor","output":"Opened /etc/fstab in vi","accepted":["vi /etc/fstab","vim /etc/fstab","sudo vi /etc/fstab","sudo vim /etc/fstab"]},{"commandName":"locate","target":"Locate the ssh_config file.","expected":"locate ssh_config","hint":"use the filename database","output":"/etc/ssh/ssh_config\n/usr/share/man/man5/ssh_config.5.gz","accepted":["locate ssh_config","find /etc -name ssh_config","find /etc -name 'ssh_config'"]},{"commandName":"rsync","target":"Synchronize /srv/www/ to /backup/www/.","expected":"rsync -av /srv/www/ /backup/www/","hint":"archive mode plus verbose","output":"sending incremental file list\n./\nindex.html","accepted":["rsync -av /srv/www/ /backup/www/","rsync -va /srv/www/ /backup/www/","rsync -a -v /srv/www/ /backup/www/","rsync --archive --verbose /srv/www/ /backup/www/"]}],"initialPrompt":"student@lab:~$"},{"title":"Scenario 8 • Shell and admin finishers","summary":"Run a script, inspect memory and kernel details, and clean up old data.","steps":[{"commandName":"bash","target":"Run the script backup.sh with bash.","expected":"bash backup.sh","hint":"invoke the script with the bash shell","output":"backup.sh: completed successfully","accepted":["bash backup.sh","bash ./backup.sh","./backup.sh","sh backup.sh","sh ./backup.sh"]},{"commandName":"alias","target":"Create an alias named ll for ls -la.","expected":"alias ll=\"ls -la\"","hint":"quote the command string","output":"Alias created: ll=ls -la","accepted":["alias ll=\"ls -la\"","alias ll='ls -la'","alias ll=\"ls -al\"","alias ll='ls -al'"]},{"commandName":"free","target":"Display memory usage in human-readable format.","expected":"free -h","hint":"show RAM and swap in human units","output":"Mem: 7.7Gi total, 2.1Gi used, 4.8Gi free","accepted":["free -h","free --human"]},{"commandName":"uname","target":"Display the running kernel release.","expected":"uname -r","hint":"print only the release string","output":"6.8.0-28-generic","accepted":["uname -r","uname --kernel-release"]},{"commandName":"visudo","target":"Safely edit the sudoers file.","expected":"visudo","hint":"use the dedicated sudoers editor","output":"Opened sudoers file with syntax checking enabled","accepted":["visudo","sudo visudo"]},{"commandName":"rm","target":"Recursively remove the old_backups directory.","expected":"rm -r old_backups","hint":"remove a directory tree","output":"Removed old_backups/","accepted":["rm -r old_backups","rm -rf old_backups","rm --recursive old_backups","rm --recursive --force old_backups"]},{"commandName":"sed","target":"Replace localhost with server1 in hosts.txt using sed in place.","expected":"sed -i \"s/localhost/server1/\" hosts.txt","hint":"use in-place substitution","output":"Updated hosts.txt in place","accepted":["sed -i \"s/localhost/server1/\" hosts.txt","sed -i 's/localhost/server1/' hosts.txt","sed -i \"s/localhost/server1/g\" hosts.txt","sed -i 's/localhost/server1/g' hosts.txt"]}],"initialPrompt":"student@lab:~$"}],"caseInsensitive":false};
const screen = document.getElementById('screen');
const terminal = document.querySelector('.platform-terminal');
const scenarioList = document.getElementById('scenarioList');
const stepList = document.getElementById('stepList');
const scenarioTitle = document.getElementById('scenarioTitle');
const scenarioCounter = document.getElementById('scenarioCounter');
const scenarioGoal = document.getElementById('scenarioGoal');
const taskProgress = document.getElementById('taskProgress');
const storageKey = `${location.pathname}::progress-v2`;

function blankCommands(){ return labData.scenarios.map(() => []); }
function defaultState(){
  return { active: 0, progress: labData.scenarios.map(() => 0), complete: labData.scenarios.map(() => false), commands: blankCommands() };
}
function loadState(){
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.progress) || parsed.progress.length !== labData.scenarios.length) return defaultState();
    parsed.active = Number.isInteger(parsed.active) && parsed.active >= 0 && parsed.active < labData.scenarios.length ? parsed.active : 0;
    parsed.complete = Array.isArray(parsed.complete) && parsed.complete.length === labData.scenarios.length ? parsed.complete : labData.scenarios.map(() => false);
    parsed.commands = Array.isArray(parsed.commands) && parsed.commands.length === labData.scenarios.length ? parsed.commands : blankCommands();
    parsed.commands = parsed.commands.map((items) => Array.isArray(items) ? items : []);
    return parsed;
  } catch (err) {
    return defaultState();
  }
}
let state = loadState();
function saveState(){ localStorage.setItem(storageKey, JSON.stringify(state)); }
function sanitize(value){ return String(value).replace(/[&<>\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch])); }
function addLine(text, cls=''){
  const p = document.createElement('p');
  p.className = ('output-line ' + cls).trim();
  p.innerHTML = text;
  screen.appendChild(p);
  screen.scrollTop = screen.scrollHeight;
}
function currentPrompt(scenario, stepIndex){
  let prompt = scenario.initialPrompt || labData.prompt || '$';
  for (let index = 0; index < stepIndex; index += 1) {
    if (scenario.steps[index].promptAfter) prompt = scenario.steps[index].promptAfter;
  }
  return prompt;
}
function focusInput(){
  const input = document.getElementById('cmdInput');
  if (input) input.focus({preventScroll:true});
}
function addPromptInput(scenario, stepIndex){
  const wrap = document.createElement('label');
  wrap.className = 'prompt-line';
  wrap.innerHTML = `<span class="prompt-label">${sanitize(currentPrompt(scenario, stepIndex))}</span><input class="cmd-input" id="cmdInput" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" />`;
  screen.appendChild(wrap);
  const input = document.getElementById('cmdInput');
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      submitCommand();
    }
  });
  focusInput();
  screen.scrollTop = screen.scrollHeight;
}
function renderScenarioList(){
  scenarioList.innerHTML = '';
  labData.scenarios.forEach((scenario, index) => {
    const btn = document.createElement('button');
    btn.className = 'scenario-btn' + (index === state.active ? ' active' : '');
    const done = state.complete[index] ? ' • Complete' : ' • ' + state.progress[index] + '/' + scenario.steps.length + ' steps';
    btn.innerHTML = `<strong>${sanitize(scenario.title)}</strong><small>${sanitize(scenario.summary)}${done}</small>`;
    btn.addEventListener('click', () => { state.active = index; saveState(); render(); });
    scenarioList.appendChild(btn);
  });
}
function renderSteps(scenario){
  stepList.innerHTML = '';
  const currentIndex = state.progress[state.active];
  scenario.steps.forEach((step, index) => {
    const item = document.createElement('div');
    const status = index < currentIndex ? 'done' : index === currentIndex ? 'active' : '';
    item.className = ('step ' + status).trim();
    const marker = index < currentIndex ? '✓' : String(index + 1).padStart(2, '0');
    item.innerHTML = `<span class="task-marker">${marker}</span><strong>${sanitize(step.target)}</strong>`;
    stepList.appendChild(item);
  });
  taskProgress.textContent = `${Math.min(currentIndex, scenario.steps.length)} / ${scenario.steps.length}`;
}
function renderTerminal(scenario){
  screen.innerHTML = '';
  scenario.steps.forEach((step, index) => {
    if (index < state.progress[state.active]) {
      const submitted = state.commands[state.active][index] || step.expected;
      addLine(`${sanitize(currentPrompt(scenario, index))} ${sanitize(submitted)}`, 'command-line');
      addLine(sanitize(step.output), 'sys');
    }
  });
  const currentIndex = state.progress[state.active];
  const current = scenario.steps[currentIndex];
  if (current) addPromptInput(scenario, currentIndex);
  else addLine('Scenario complete.', 'ok');
}
function renderScenarioHeader(scenario){
  scenarioTitle.textContent = scenario.title;
  const currentIndex = state.progress[state.active];
  scenarioCounter.textContent = currentIndex >= scenario.steps.length ? `${scenario.steps.length} / ${scenario.steps.length}` : `Step ${currentIndex + 1} / ${scenario.steps.length}`;
  const current = scenario.steps[currentIndex];
  scenarioGoal.textContent = current ? current.target : 'Scenario complete.';
}
function render(){
  const scenario = labData.scenarios[state.active];
  renderScenarioList();
  renderScenarioHeader(scenario);
  renderSteps(scenario);
  renderTerminal(scenario);
}
function normalize(value){
  let result = String(value || '')
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .trim()
    .replace(/;\s*$/, '')
    .replace(/\s*\|\s*/g, ' | ')
    .replace(/\s+/g, ' ');
  if (labData.caseInsensitive) result = result.toLowerCase();
  return result;
}
function commandMatches(value, step){
  const entered = normalize(value);
  const accepted = Array.isArray(step.accepted) && step.accepted.length ? step.accepted : [step.expected];
  if (accepted.some(candidate => entered === normalize(candidate))) return true;
  const flags = labData.caseInsensitive ? 'i' : '';
  return (step.acceptedPatterns || []).some(pattern => {
    try { return new RegExp(pattern, flags).test(String(value).trim()); }
    catch (err) { return false; }
  });
}
function completeCurrentStep(command, forceReveal=false){
  const scenario = labData.scenarios[state.active];
  const stepIndex = state.progress[state.active];
  const step = scenario.steps[stepIndex];
  if (!step) return;
  state.commands[state.active][stepIndex] = command || step.expected;
  state.progress[state.active] += 1;
  if (state.progress[state.active] >= scenario.steps.length) state.complete[state.active] = true;
  saveState();
  render();
}
function submitCommand(){
  const input = document.getElementById('cmdInput');
  if (!input) return;
  const rawValue = input.value || '';
  const value = rawValue.trim();
  if (!value) return;
  const scenario = labData.scenarios[state.active];
  const stepIndex = state.progress[state.active];
  const step = scenario.steps[stepIndex];
  if (commandMatches(value, step)) {
    completeCurrentStep(value, false);
    return;
  }
  const promptRow = input.closest('.prompt-line');
  if (promptRow) promptRow.remove();
  addLine(`${sanitize(currentPrompt(scenario, stepIndex))} ${sanitize(value)}`, 'command-line');
  addLine('Command not accepted for this task. Check the task or use Hint.', 'bad');
  addPromptInput(scenario, stepIndex);
}
terminal.addEventListener('pointerdown', (event) => {
  if (event.target.closest('button, input')) return;
  event.preventDefault();
  focusInput();
});
terminal.addEventListener('click', (event) => {
  if (event.target.closest('button')) return;
  focusInput();
});
document.getElementById('hintBtn').addEventListener('click', () => {
  const scenario = labData.scenarios[state.active];
  const step = scenario.steps[state.progress[state.active]];
  if (!step) return;
  addLine(`Hint: ${sanitize(step.hint)}`, 'warn');
  focusInput();
});
document.getElementById('revealBtn').addEventListener('click', () => {
  const scenario = labData.scenarios[state.active];
  const step = scenario.steps[state.progress[state.active]];
  if (!step) return;
  completeCurrentStep(step.expected, true);
});
document.getElementById('resetScenarioBtn').addEventListener('click', () => {
  state.progress[state.active] = 0;
  state.complete[state.active] = false;
  state.commands[state.active] = [];
  saveState();
  render();
});
document.getElementById('resetAllBtn').addEventListener('click', () => {
  state = defaultState();
  saveState();
  render();
});
render();
</script>
</body>
</html>
