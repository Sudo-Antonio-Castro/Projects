<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <meta name="theme-color" content="#130e22">

<body class="roadmap-theme rm-cli cli-powershell" data-roadmap-theme="option-3">
<header>
  <div class="topbar">
    <div class="brand">
      <div class="logo">CLI</div>
      <div>
        <h1>Projects • PowerShell</h1>
        <p><a href="../../index.html">Projects</a> / <a href="../index.html">CLI Labs</a> / PowerShell</p>
      </div>
    </div>
  </div>
<nav class="roadmap-global-nav" aria-label="Global project navigation"><a data-section="home" href="../../index.html">Home</a><a data-section="comptia" href="../../CompTIA/index.html">Tracks</a><a data-section="ec-council" href="../../EC-Council/index.html">CEH</a><a data-section="clis" href="../index.html">Labs</a><a data-section="it-knowledge-base-articles" href="../../IT-Knowledge-Base-Articles/index.html">Library</a><a data-section="apps" href="../../Apps/index.html">Apps</a></nav></header>
<main class="shell cli-shell">
  <section class="layout cli-workspace" id="app">
    <aside class="panel sidebar scenario-panel">
      <h2>Scenarios</h2>
      <div class="scenario-list" id="scenarioList"></div>
    </aside>

    <section class="panel terminal-wrap">
      <div class="terminal-head">
        <div>
          <span class="platform-label">Windows PowerShell</span>
          <h2 id="scenarioTitle">Loading…</h2>
        </div>
        <strong class="step-counter" id="scenarioCounter">Step 0 / 0</strong>
      </div>

      <div class="current-task" aria-live="polite">
        <span>Current task</span>
        <p id="scenarioGoal"></p>
      </div>

      <div class="terminal platform-terminal">
        <div class="terminal-top powershell-titlebar">
          <div class="windows-tabs"><span class="powershell-tab"><span class="ps-icon" aria-hidden="true">&gt;_</span> Windows PowerShell</span><span class="new-tab" aria-hidden="true">+</span><span class="tab-menu" aria-hidden="true">⌄</span></div>
          <div class="window-controls windows-controls" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div>
        </div>
        <div class="screen" id="screen"></div>
        <div class="toolbar">
          <button id="hintBtn">Hint</button>
          <button id="revealBtn">Reveal</button>
          <button id="resetScenarioBtn">Reset scenario</button>
          <button class="quiet" id="resetAllBtn">Reset all</button>
        </div>
      </div>
    </section>

    <aside class="panel stack task-panel">
      <div class="task-heading">
        <h2>Tasks</h2>
        <span id="taskProgress">0 / 0</span>
      </div>
      <div class="list" id="stepList"></div>
    </aside>
  </section>
</main>
<script>
const labData = {"prompt":"PS C:\\Lab>","scenarios":[{"title":"Scenario 1 • Navigate and stage a workspace","summary":"Move through folders and create the first practice files.","steps":[{"commandName":"Get-Location","target":"Show the current location.","expected":"Get-Location","hint":"print the working path","output":"Path\n----\nC:\\Users\\Student","accepted":["Get-Location","gl","pwd"]},{"commandName":"Set-Location","target":"Move into C:\\Lab.","expected":"Set-Location C:\\Lab","hint":"change your current path","output":"Location changed to C:\\Lab","accepted":["Set-Location C:\\Lab","Set-Location -Path C:\\Lab","Set-Location \"C:\\Lab\"","Set-Location 'C:\\Lab'","cd C:\\Lab","chdir C:\\Lab","sl C:\\Lab"],"promptAfter":"PS C:\\Lab>"},{"commandName":"Get-ChildItem","target":"List the items in the current directory.","expected":"Get-ChildItem","hint":"directory listing","output":"Mode   LastWriteTime         Length Name\n----   -------------         ------ ----\nd----  4/13/2026  10:10 AM          Scripts","accepted":["Get-ChildItem","gci","dir","ls"]},{"commandName":"New-Item","target":"Create a directory named Reports.","expected":"New-Item -ItemType Directory -Name Reports","hint":"new item, directory type","output":"Directory: C:\\Lab\\Reports","accepted":["New-Item -ItemType Directory -Name Reports","New-Item -Name Reports -ItemType Directory","New-Item Reports -ItemType Directory","New-Item -Path Reports -ItemType Directory","ni Reports -ItemType Directory","mkdir Reports","md Reports"]},{"commandName":"Copy-Item","target":"Copy notes.txt to notes.bak.txt.","expected":"Copy-Item .\\notes.txt .\\notes.bak.txt","hint":"copy source to destination","output":"Copied notes.txt to notes.bak.txt","accepted":["Copy-Item .\\notes.txt .\\notes.bak.txt","Copy-Item notes.txt notes.bak.txt","Copy-Item -Path .\\notes.txt -Destination .\\notes.bak.txt","Copy-Item -Destination .\\notes.bak.txt -Path .\\notes.txt","cp .\\notes.txt .\\notes.bak.txt","copy .\\notes.txt .\\notes.bak.txt","cpi .\\notes.txt .\\notes.bak.txt"]},{"commandName":"Move-Item","target":"Rename notes.bak.txt to notes-archive.txt.","expected":"Move-Item .\\notes.bak.txt .\\notes-archive.txt","hint":"move item for a rename","output":"Moved notes.bak.txt to notes-archive.txt","accepted":["Move-Item .\\notes.bak.txt .\\notes-archive.txt","Move-Item notes.bak.txt notes-archive.txt","Move-Item -Path .\\notes.bak.txt -Destination .\\notes-archive.txt","mv .\\notes.bak.txt .\\notes-archive.txt","move .\\notes.bak.txt .\\notes-archive.txt","mi .\\notes.bak.txt .\\notes-archive.txt","Rename-Item .\\notes.bak.txt notes-archive.txt","ren .\\notes.bak.txt notes-archive.txt"]}],"initialPrompt":"PS C:\\Users\\Student>"},{"title":"Scenario 2 • Read and filter content","summary":"Use the pipeline to read data and narrow down what matters.","steps":[{"commandName":"Get-Content","target":"Display the contents of notes-archive.txt.","expected":"Get-Content .\\notes-archive.txt","hint":"read a text file line by line","output":"server01\nserver02\nserver03","accepted":["Get-Content .\\notes-archive.txt","Get-Content notes-archive.txt","Get-Content -Path .\\notes-archive.txt","gc .\\notes-archive.txt","cat .\\notes-archive.txt","type .\\notes-archive.txt"]},{"commandName":"Select-String","target":"Search services.log for the word error.","expected":"Select-String -Path .\\services.log -Pattern error","hint":"pattern match in a file","output":"services.log:14: Error starting Spooler","accepted":["Select-String -Path .\\services.log -Pattern error","Select-String -Pattern error -Path .\\services.log","Select-String error .\\services.log","sls error .\\services.log","Get-Content .\\services.log | Select-String error","gc .\\services.log | sls error"]},{"commandName":"Sort-Object","target":"Sort processes.txt alphabetically.","expected":"Get-Content .\\processes.txt | Sort-Object","hint":"send objects down the pipeline to sort them","output":"chrome\nexplorer\nnotepad\npowershell","accepted":["Get-Content .\\processes.txt | Sort-Object","Get-Content processes.txt | Sort-Object","gc .\\processes.txt | sort","cat .\\processes.txt | Sort-Object"]},{"commandName":"Where-Object","target":"Filter services to only running services.","expected":"Get-Service | Where-Object Status -eq Running","hint":"filter by a property comparison","output":"Status   Name               DisplayName\n------   ----               -----------\nRunning  EventLog           Windows Event Log","accepted":["Get-Service | Where-Object Status -eq Running","Get-Service | Where-Object Status -eq 'Running'","Get-Service | Where-Object {$_.Status -eq \"Running\"}","Get-Service | Where-Object {$_.Status -eq 'Running'}","gsv | ? Status -eq Running","Get-Service | where Status -eq Running"]},{"commandName":"Measure-Object","target":"Count the files in the current directory.","expected":"Get-ChildItem | Measure-Object","hint":"pipe items into a measurement command","output":"Count    : 6","accepted":["Get-ChildItem | Measure-Object","gci | measure","dir | Measure-Object","(Get-ChildItem).Count","(gci).Count"]},{"commandName":"Get-History","target":"Display your PowerShell history.","expected":"Get-History","hint":"show previous commands","output":"Id  CommandLine\n--  -----------\n1   Get-Location","accepted":["Get-History","ghy","history","h"]}],"initialPrompt":"PS C:\\Lab>"},{"title":"Scenario 3 • Services and processes","summary":"Check service health and stop a bad process.","steps":[{"commandName":"Get-Service","target":"Show the Spooler service.","expected":"Get-Service Spooler","hint":"query a specific service by name","output":"Status   Name      DisplayName\n------   ----      -----------\nRunning  Spooler   Print Spooler","accepted":["Get-Service Spooler","Get-Service -Name Spooler","gsv Spooler"]},{"commandName":"Restart-Service","target":"Restart the Spooler service.","expected":"Restart-Service Spooler","hint":"bounce a service","output":"Restarted service: Spooler","accepted":["Restart-Service Spooler","Restart-Service -Name Spooler","Get-Service Spooler | Restart-Service"]},{"commandName":"Get-Process","target":"Display the chrome process.","expected":"Get-Process chrome","hint":"query a process by name","output":"Handles  NPM(K)    PM(K)      WS(K)     CPU(s)     Id  ProcessName\n  1120     59    208000     302000      12.55  7324 chrome","accepted":["Get-Process chrome","Get-Process -Name chrome","gps chrome","ps chrome"]},{"commandName":"Stop-Process","target":"Stop process ID 7324.","expected":"Stop-Process -Id 7324","hint":"stop by ID","output":"Stopped process 7324","accepted":["Stop-Process -Id 7324","Stop-Process 7324","spps -Id 7324","kill 7324","Get-Process -Id 7324 | Stop-Process"]},{"commandName":"Get-EventLog","target":"Read the newest 10 System log entries.","expected":"Get-EventLog -LogName System -Newest 10","hint":"legacy event log query","output":"Index Time          EntryType Source\n----- ----          --------- ------\n...","accepted":["Get-EventLog -LogName System -Newest 10","Get-EventLog -Newest 10 -LogName System","Get-EventLog System -Newest 10","Get-WinEvent -LogName System -MaxEvents 10","Get-WinEvent -MaxEvents 10 -LogName System"]},{"commandName":"Start-Transcript","target":"Start a transcript in .\\session.txt.","expected":"Start-Transcript -Path .\\session.txt","hint":"begin logging the shell session","output":"Transcript started, output file is .\\session.txt","accepted":["Start-Transcript -Path .\\session.txt","Start-Transcript .\\session.txt","Start-Transcript -Path session.txt","Start-Transcript session.txt"]}],"initialPrompt":"PS C:\\Lab>"},{"title":"Scenario 4 • Network and web checks","summary":"Verify IP settings and test outbound connectivity.","steps":[{"commandName":"Get-NetIPConfiguration","target":"Display current network configuration.","expected":"Get-NetIPConfiguration","hint":"IP addresses, gateways, and DNS","output":"InterfaceAlias : Ethernet\nIPv4Address    : 192.168.1.24","accepted":["Get-NetIPConfiguration","gip"]},{"commandName":"Test-Connection","target":"Ping 8.8.8.8 twice.","expected":"Test-Connection 8.8.8.8 -Count 2","hint":"ICMP test with limited count","output":"Destination: 8.8.8.8\nReply from 8.8.8.8: bytes=32 time=14ms TTL=117","accepted":["Test-Connection 8.8.8.8 -Count 2","Test-Connection -ComputerName 8.8.8.8 -Count 2","Test-Connection -TargetName 8.8.8.8 -Count 2","Test-Connection -Count 2 8.8.8.8","ping 8.8.8.8 -n 2"]},{"commandName":"Test-NetConnection","target":"Test TCP port 443 on example.com.","expected":"Test-NetConnection example.com -Port 443","hint":"network test with port validation","output":"ComputerName     : example.com\nRemotePort       : 443\nTcpTestSucceeded : True","accepted":["Test-NetConnection example.com -Port 443","Test-NetConnection -ComputerName example.com -Port 443","Test-NetConnection -Port 443 example.com","tnc example.com -Port 443"]},{"commandName":"Invoke-WebRequest","target":"Fetch https://example.com and save it to page.html.","expected":"Invoke-WebRequest https://example.com -OutFile .\\page.html","hint":"download a page to a file","output":"Saved response to .\\page.html","accepted":["Invoke-WebRequest https://example.com -OutFile .\\page.html","Invoke-WebRequest -Uri https://example.com -OutFile .\\page.html","Invoke-WebRequest -OutFile .\\page.html -Uri https://example.com","iwr https://example.com -OutFile .\\page.html","wget https://example.com -OutFile .\\page.html","curl https://example.com -OutFile .\\page.html"]},{"commandName":"Resolve-DnsName","target":"Resolve the A record for example.com.","expected":"Resolve-DnsName example.com","hint":"query DNS from PowerShell","output":"Name      Type TTL Section IPAddress\n----      ---- --- ------- ---------\nexample.com A  300 Answer  93.184.216.34","accepted":["Resolve-DnsName example.com","Resolve-DnsName -Name example.com","Resolve-DnsName example.com -Type A","Resolve-DnsName -Name example.com -Type A","nslookup -type=A example.com"]},{"commandName":"Get-NetTCPConnection","target":"List established TCP connections.","expected":"Get-NetTCPConnection -State Established","hint":"filter by state","output":"LocalAddress LocalPort RemoteAddress RemotePort State\n------------ --------- ------------- ---------- -----\n192.168.1.24 49718     93.184.216.34 443        Established","accepted":["Get-NetTCPConnection -State Established","Get-NetTCPConnection -State \"Established\"","Get-NetTCPConnection -State 'Established'","Get-NetTCPConnection | Where-Object State -eq Established","Get-NetTCPConnection | ? State -eq Established"]}],"initialPrompt":"PS C:\\Lab>"},{"title":"Scenario 5 • Archive and environment tasks","summary":"Package a folder, expand it, and inspect environment details.","steps":[{"commandName":"Compress-Archive","target":"Compress the Reports folder into Reports.zip.","expected":"Compress-Archive -Path .\\Reports -DestinationPath .\\Reports.zip","hint":"create a zip archive","output":"Compressed .\\Reports to .\\Reports.zip","accepted":["Compress-Archive -Path .\\Reports -DestinationPath .\\Reports.zip","Compress-Archive -DestinationPath .\\Reports.zip -Path .\\Reports","Compress-Archive .\\Reports .\\Reports.zip","Compress-Archive -Path Reports -DestinationPath Reports.zip"]},{"commandName":"Expand-Archive","target":"Extract Reports.zip to .\\Extracted.","expected":"Expand-Archive .\\Reports.zip -DestinationPath .\\Extracted","hint":"unpack the zip archive","output":"Expanded .\\Reports.zip to .\\Extracted","accepted":["Expand-Archive .\\Reports.zip -DestinationPath .\\Extracted","Expand-Archive -Path .\\Reports.zip -DestinationPath .\\Extracted","Expand-Archive -DestinationPath .\\Extracted -Path .\\Reports.zip","Expand-Archive Reports.zip Extracted"]},{"commandName":"Get-ComputerInfo","target":"Display basic computer info.","expected":"Get-ComputerInfo","hint":"system metadata cmdlet","output":"WindowsProductName : Windows 11 Pro\nOsVersion          : 10.0.26100","accepted":["Get-ComputerInfo","systeminfo"]},{"commandName":"Get-Help","target":"Open help for Get-Service.","expected":"Get-Help Get-Service","hint":"PowerShell help system","output":"NAME\n    Get-Service","accepted":["Get-Help Get-Service","Get-Help -Name Get-Service","help Get-Service","man Get-Service"]},{"commandName":"Get-Alias","target":"Display aliases for dir.","expected":"Get-Alias dir","hint":"show the alias mapping","output":"CommandType Name Version Source\n----------- ---- ------- ------\nAlias       dir -> Get-ChildItem","accepted":["Get-Alias dir","Get-Alias -Name dir","gal dir"]},{"commandName":"Remove-Item","target":"Delete the .\\Extracted folder recursively.","expected":"Remove-Item .\\Extracted -Recurse","hint":"remove a directory tree","output":"Removed .\\Extracted and all child items","accepted":["Remove-Item .\\Extracted -Recurse","Remove-Item -Path .\\Extracted -Recurse","Remove-Item -Recurse .\\Extracted","Remove-Item .\\Extracted -Recurse -Force","rm .\\Extracted -Recurse","rmdir .\\Extracted -Recurse","ri .\\Extracted -Recurse"]}],"initialPrompt":"PS C:\\Lab>"}],"caseInsensitive":true};
const screen = document.getElementById('screen');
const terminal = document.querySelector('.platform-terminal');
const scenarioList = document.getElementById('scenarioList');
const stepList = document.getElementById('stepList');
const scenarioTitle = document.getElementById('scenarioTitle');
const scenarioCounter = document.getElementById('scenarioCounter');
const scenarioGoal = document.getElementById('scenarioGoal');
const taskProgress = document.getElementById('taskProgress');
const storageKey = `${location.pathname}::progress-v2`;

function blankCommands(){ return labData.scenarios.map(() => []); }
function defaultState(){
  return { active: 0, progress: labData.scenarios.map(() => 0), complete: labData.scenarios.map(() => false), commands: blankCommands() };
}
function loadState(){
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.progress) || parsed.progress.length !== labData.scenarios.length) return defaultState();
    parsed.active = Number.isInteger(parsed.active) && parsed.active >= 0 && parsed.active < labData.scenarios.length ? parsed.active : 0;
    parsed.complete = Array.isArray(parsed.complete) && parsed.complete.length === labData.scenarios.length ? parsed.complete : labData.scenarios.map(() => false);
    parsed.commands = Array.isArray(parsed.commands) && parsed.commands.length === labData.scenarios.length ? parsed.commands : blankCommands();
    parsed.commands = parsed.commands.map((items) => Array.isArray(items) ? items : []);
    return parsed;
  } catch (err) {
    return defaultState();
  }
}
let state = loadState();
function saveState(){ localStorage.setItem(storageKey, JSON.stringify(state)); }
function sanitize(value){ return String(value).replace(/[&<>\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch])); }
function addLine(text, cls=''){
  const p = document.createElement('p');
  p.className = ('output-line ' + cls).trim();
  p.innerHTML = text;
  screen.appendChild(p);
  screen.scrollTop = screen.scrollHeight;
}
function currentPrompt(scenario, stepIndex){
  let prompt = scenario.initialPrompt || labData.prompt || '$';
  for (let index = 0; index < stepIndex; index += 1) {
    if (scenario.steps[index].promptAfter) prompt = scenario.steps[index].promptAfter;
  }
  return prompt;
}
function focusInput(){
  const input = document.getElementById('cmdInput');
  if (input) input.focus({preventScroll:true});
}
function addPromptInput(scenario, stepIndex){
  const wrap = document.createElement('label');
  wrap.className = 'prompt-line';
  wrap.innerHTML = `<span class="prompt-label">${sanitize(currentPrompt(scenario, stepIndex))}</span><input class="cmd-input" id="cmdInput" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" />`;
  screen.appendChild(wrap);
  const input = document.getElementById('cmdInput');
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      submitCommand();
    }
  });
  focusInput();
  screen.scrollTop = screen.scrollHeight;
}
function renderScenarioList(){
  scenarioList.innerHTML = '';
  labData.scenarios.forEach((scenario, index) => {
    const btn = document.createElement('button');
    btn.className = 'scenario-btn' + (index === state.active ? ' active' : '');
    const done = state.complete[index] ? ' • Complete' : ' • ' + state.progress[index] + '/' + scenario.steps.length + ' steps';
    btn.innerHTML = `<strong>${sanitize(scenario.title)}</strong><small>${sanitize(scenario.summary)}${done}</small>`;
    btn.addEventListener('click', () => { state.active = index; saveState(); render(); });
    scenarioList.appendChild(btn);
  });
}
function renderSteps(scenario){
  stepList.innerHTML = '';
  const currentIndex = state.progress[state.active];
  scenario.steps.forEach((step, index) => {
    const item = document.createElement('div');
    const status = index < currentIndex ? 'done' : index === currentIndex ? 'active' : '';
    item.className = ('step ' + status).trim();
    const marker = index < currentIndex ? '✓' : String(index + 1).padStart(2, '0');
    item.innerHTML = `<span class="task-marker">${marker}</span><strong>${sanitize(step.target)}</strong>`;
    stepList.appendChild(item);
  });
  taskProgress.textContent = `${Math.min(currentIndex, scenario.steps.length)} / ${scenario.steps.length}`;
}
function renderTerminal(scenario){
  screen.innerHTML = '';
  scenario.steps.forEach((step, index) => {
    if (index < state.progress[state.active]) {
      const submitted = state.commands[state.active][index] || step.expected;
      addLine(`${sanitize(currentPrompt(scenario, index))} ${sanitize(submitted)}`, 'command-line');
      addLine(sanitize(step.output), 'sys');
    }
  });
  const currentIndex = state.progress[state.active];
  const current = scenario.steps[currentIndex];
  if (current) addPromptInput(scenario, currentIndex);
  else addLine('Scenario complete.', 'ok');
}
function renderScenarioHeader(scenario){
  scenarioTitle.textContent = scenario.title;
  const currentIndex = state.progress[state.active];
  scenarioCounter.textContent = currentIndex >= scenario.steps.length ? `${scenario.steps.length} / ${scenario.steps.length}` : `Step ${currentIndex + 1} / ${scenario.steps.length}`;
  const current = scenario.steps[currentIndex];
  scenarioGoal.textContent = current ? current.target : 'Scenario complete.';
}
function render(){
  const scenario = labData.scenarios[state.active];
  renderScenarioList();
  renderScenarioHeader(scenario);
  renderSteps(scenario);
  renderTerminal(scenario);
}
function normalize(value){
  let result = String(value || '')
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .trim()
    .replace(/;\s*$/, '')
    .replace(/\s*\|\s*/g, ' | ')
    .replace(/\s+/g, ' ');
  if (labData.caseInsensitive) result = result.toLowerCase();
  return result;
}
function commandMatches(value, step){
  const entered = normalize(value);
  const accepted = Array.isArray(step.accepted) && step.accepted.length ? step.accepted : [step.expected];
  if (accepted.some(candidate => entered === normalize(candidate))) return true;
  const flags = labData.caseInsensitive ? 'i' : '';
  return (step.acceptedPatterns || []).some(pattern => {
    try { return new RegExp(pattern, flags).test(String(value).trim()); }
    catch (err) { return false; }
  });
}
function completeCurrentStep(command, forceReveal=false){
  const scenario = labData.scenarios[state.active];
  const stepIndex = state.progress[state.active];
  const step = scenario.steps[stepIndex];
  if (!step) return;
  state.commands[state.active][stepIndex] = command || step.expected;
  state.progress[state.active] += 1;
  if (state.progress[state.active] >= scenario.steps.length) state.complete[state.active] = true;
  saveState();
  render();
}
function submitCommand(){
  const input = document.getElementById('cmdInput');
  if (!input) return;
  const rawValue = input.value || '';
  const value = rawValue.trim();
  if (!value) return;
  const scenario = labData.scenarios[state.active];
  const stepIndex = state.progress[state.active];
  const step = scenario.steps[stepIndex];
  if (commandMatches(value, step)) {
    completeCurrentStep(value, false);
    return;
  }
  const promptRow = input.closest('.prompt-line');
  if (promptRow) promptRow.remove();
  addLine(`${sanitize(currentPrompt(scenario, stepIndex))} ${sanitize(value)}`, 'command-line');
  addLine('Command not accepted for this task. Check the task or use Hint.', 'bad');
  addPromptInput(scenario, stepIndex);
}
terminal.addEventListener('pointerdown', (event) => {
  if (event.target.closest('button, input')) return;
  event.preventDefault();
  focusInput();
});
terminal.addEventListener('click', (event) => {
  if (event.target.closest('button')) return;
  focusInput();
});
document.getElementById('hintBtn').addEventListener('click', () => {
  const scenario = labData.scenarios[state.active];
  const step = scenario.steps[state.progress[state.active]];
  if (!step) return;
  addLine(`Hint: ${sanitize(step.hint)}`, 'warn');
  focusInput();
});
document.getElementById('revealBtn').addEventListener('click', () => {
  const scenario = labData.scenarios[state.active];
  const step = scenario.steps[state.progress[state.active]];
  if (!step) return;
  completeCurrentStep(step.expected, true);
});
document.getElementById('resetScenarioBtn').addEventListener('click', () => {
  state.progress[state.active] = 0;
  state.complete[state.active] = false;
  state.commands[state.active] = [];
  saveState();
  render();
});
document.getElementById('resetAllBtn').addEventListener('click', () => {
  state = defaultState();
  saveState();
  render();
});
render();
</script>
</body>
</html>
