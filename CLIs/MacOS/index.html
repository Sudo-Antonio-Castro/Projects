<script>
const labData = {"prompt":"student@macbook ~ %","scenarios":[{"title":"Scenario 1 • Finder to terminal workflow","summary":"Create and move around a macOS workspace from the shell.","steps":[{"commandName":"pwd","target":"Show the current working directory.","expected":"pwd","hint":"print the current path","output":"/Users/student","accepted":["pwd"]},{"commandName":"ls","target":"List the files in the current directory with detail.","expected":"ls -lah","hint":"include hidden files and human-readable sizes","output":"drwxr-xr-x   8 student  staff   256B Apr 13 10:33 Projects","accepted":["ls -lah","ls -alh","ls -lAh","ls -la","ls -al","ls -l"]},{"commandName":"cd","target":"Change into the Projects folder.","expected":"cd Projects","hint":"switch directories","output":"/Users/student/Projects","accepted":["cd Projects","cd ./Projects","cd ~/Projects","cd /Users/student/Projects"],"promptAfter":"student@macbook Projects %"},{"commandName":"mkdir","target":"Create a folder named MacLab.","expected":"mkdir MacLab","hint":"make a new directory","output":"Created directory: MacLab","accepted":["mkdir MacLab","mkdir ./MacLab","mkdir -p MacLab"]},{"commandName":"touch","target":"Create a file named notes.md.","expected":"touch notes.md","hint":"create an empty file","output":"Created file: notes.md","accepted":["touch notes.md","touch ./notes.md","> notes.md",": > notes.md"]},{"commandName":"cp","target":"Copy notes.md to notes-copy.md.","expected":"cp notes.md notes-copy.md","hint":"copy source to destination","output":"Copied notes.md to notes-copy.md","accepted":["cp notes.md notes-copy.md","cp ./notes.md ./notes-copy.md","cp -p notes.md notes-copy.md"]}],"initialPrompt":"student@macbook ~ %"},{"title":"Scenario 2 • Open, clipboard, and system identity","summary":"Use a few Mac-specific terminal conveniences.","steps":[{"commandName":"mv","target":"Rename notes-copy.md to notes-archive.md.","expected":"mv notes-copy.md notes-archive.md","hint":"rename or move a file","output":"Renamed notes-copy.md to notes-archive.md","accepted":["mv notes-copy.md notes-archive.md","mv ./notes-copy.md ./notes-archive.md"]},{"commandName":"open","target":"Open the current folder in Finder.","expected":"open .","hint":"launch a file or folder from the terminal","output":"Opened current directory in Finder","accepted":["open .","open ./","open -a Finder ."]},{"commandName":"pbcopy","target":"Copy the text from serial.txt into the clipboard.","expected":"pbcopy < serial.txt","hint":"redirect a file into the clipboard command","output":"Copied serial.txt contents to the clipboard","accepted":["pbcopy < serial.txt","pbcopy < ./serial.txt","cat serial.txt | pbcopy","cat ./serial.txt | pbcopy"]},{"commandName":"pbpaste","target":"Paste the clipboard contents back to the terminal.","expected":"pbpaste","hint":"read clipboard text to stdout","output":"C02ABC123XYZ","accepted":["pbpaste"]},{"commandName":"sw_vers","target":"Display the macOS version information.","expected":"sw_vers","hint":"show ProductName, ProductVersion, BuildVersion","output":"ProductName:\tmacOS\nProductVersion:\t15.4\nBuildVersion:\t24E214","accepted":["sw_vers","sw_vers -productVersion","system_profiler SPSoftwareDataType"]},{"commandName":"scutil","target":"Show the computer name.","expected":"scutil --get ComputerName","hint":"ask macOS for the configured computer name","output":"Antonio-MacBook-Pro","accepted":["scutil --get ComputerName","scutil --get \"ComputerName\""]}],"initialPrompt":"student@macbook Projects %"},{"title":"Scenario 3 • Updates, disks, and network setup","summary":"Check updates and inspect local hardware and networking.","steps":[{"commandName":"softwareupdate","target":"List available software updates.","expected":"softwareupdate -l","hint":"lowercase ell to list updates","output":"Software Update Tool\nFinding available software\nNo new software available.","accepted":["softwareupdate -l","softwareupdate --list"]},{"commandName":"diskutil","target":"List attached disks.","expected":"diskutil list","hint":"Apple disk utility command-line view","output":"/dev/disk3 (external, physical):\n#: TYPE NAME SIZE IDENTIFIER","accepted":["diskutil list","diskutil list -plist"]},{"commandName":"networksetup","target":"List all network services.","expected":"networksetup -listallnetworkservices","hint":"show configured macOS network services","output":"An asterisk (*) denotes that a network service is disabled.\nWi-Fi\nUSB 10/100/1000 LAN","accepted":["networksetup -listallnetworkservices"]},{"commandName":"ifconfig","target":"Display interface configuration.","expected":"ifconfig","hint":"classic BSD network interface display","output":"en0: flags=8863<UP,BROADCAST,SMART,RUNNING,SIMPLEX,MULTICAST> mtu 1500","accepted":["ifconfig","ifconfig -a"]},{"commandName":"ping","target":"Ping apple.com three times.","expected":"ping -c 3 apple.com","hint":"limit the packet count to 3","output":"3 packets transmitted, 3 packets received, 0.0% packet loss","accepted":["ping -c 3 apple.com","ping -c3 apple.com"]},{"commandName":"curl","target":"Fetch only the headers for https://apple.com.","expected":"curl -I https://apple.com","hint":"request headers only","output":"HTTP/2 301\nlocation: https://www.apple.com/","accepted":["curl -I https://apple.com","curl -I https://apple.com/","curl --head https://apple.com","curl -sI https://apple.com"]}],"initialPrompt":"student@macbook ~ %"},{"title":"Scenario 4 • Processes, search, and permissions","summary":"Inspect activity, find files, and adjust access on macOS.","steps":[{"commandName":"ps","target":"Display all running processes.","expected":"ps aux","hint":"full process listing","output":"student      731   2.1  1.2 410557280 198560   ??  S     9:52AM   1:15.90 Finder","accepted":["ps aux","ps ax","ps -ef","ps -A"]},{"commandName":"top","target":"Open the live process viewer.","expected":"top","hint":"interactive process monitor","output":"Processes: 612 total, 4 running, 608 sleeping","accepted":["top","top -l 1"]},{"commandName":"grep","target":"Search notes-archive.md for the word server.","expected":"grep server notes-archive.md","hint":"filter for a matching word","output":"server01","accepted":["grep server notes-archive.md","grep 'server' notes-archive.md","grep \"server\" notes-archive.md","grep -n server notes-archive.md"]},{"commandName":"find","target":"Find all .md files under the current directory.","expected":"find . -name \"*.md\"","hint":"recursive search by name","output":"./notes.md\n./notes-archive.md","accepted":["find . -name \"*.md\"","find . -name '*.md'","find . -iname \"*.md\"","find . -iname '*.md'"]},{"commandName":"chmod","target":"Set notes-archive.md to mode 600.","expected":"chmod 600 notes-archive.md","hint":"owner read/write only","output":"Permissions set to 600 on notes-archive.md","accepted":["chmod 600 notes-archive.md","chmod 0600 notes-archive.md","chmod u=rw,go= notes-archive.md"]},{"commandName":"chown","target":"Change the owner of notes-archive.md to student:staff.","expected":"chown student:staff notes-archive.md","hint":"owner colon group","output":"Owner changed to student:staff","accepted":["chown student:staff notes-archive.md","sudo chown student:staff notes-archive.md","chown student.staff notes-archive.md","sudo chown student.staff notes-archive.md"]}],"initialPrompt":"student@macbook Projects %"},{"title":"Scenario 5 • Remote access and cleanup","summary":"Test SSH habits and clean up terminal-driven apps.","steps":[{"commandName":"ssh","target":"Connect to admin@example.com using SSH.","expected":"ssh admin@example.com","hint":"user at host syntax","output":"Connected to admin@example.com","accepted":["ssh admin@example.com","ssh -l admin example.com"]},{"commandName":"killall","target":"Close all TextEdit processes.","expected":"killall TextEdit","hint":"terminate all processes by exact name","output":"Terminated all TextEdit processes","accepted":["killall TextEdit","pkill -x TextEdit","killall -TERM TextEdit"]},{"commandName":"rm","target":"Remove notes-archive.md.","expected":"rm notes-archive.md","hint":"delete a single file","output":"Removed notes-archive.md","accepted":["rm notes-archive.md","rm ./notes-archive.md","rm -f notes-archive.md"]},{"commandName":"vm_stat","target":"Display virtual memory statistics.","expected":"vm_stat","hint":"macOS memory stats come from vm_stat","output":"Mach Virtual Memory Statistics: (page size of 16384 bytes)","accepted":["vm_stat","vm_stat 1"]},{"commandName":"defaults","target":"Read the global AppleInterfaceStyle setting.","expected":"defaults read -g AppleInterfaceStyle","hint":"query a defaults domain key","output":"Dark","accepted":["defaults read -g AppleInterfaceStyle","defaults read NSGlobalDomain AppleInterfaceStyle","defaults read -globalDomain AppleInterfaceStyle"]},{"commandName":"say","target":"Use Terminal to speak “Lab complete”.","expected":"say \"Lab complete\"","hint":"macOS speech synthesis command","output":"Lab complete","accepted":["say \"Lab complete\"","say 'Lab complete'","say Lab\\ complete"]}],"initialPrompt":"student@macbook Projects %"}],"caseInsensitive":false};
const screen = document.getElementById('screen');
const terminal = document.querySelector('.platform-terminal');
const scenarioList = document.getElementById('scenarioList');
const stepList = document.getElementById('stepList');
const scenarioTitle = document.getElementById('scenarioTitle');
const scenarioCounter = document.getElementById('scenarioCounter');
const scenarioGoal = document.getElementById('scenarioGoal');
const taskProgress = document.getElementById('taskProgress');
const storageKey = `${location.pathname}::progress-v2`;

function blankCommands(){ return labData.scenarios.map(() => []); }
function defaultState(){
  return { active: 0, progress: labData.scenarios.map(() => 0), complete: labData.scenarios.map(() => false), commands: blankCommands(), outcomes: labData.scenarios.map(s => s.steps.map(() => null)), drafts: labData.scenarios.map(() => '') };
}
function loadState(){
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.progress) || parsed.progress.length !== labData.scenarios.length) return defaultState();
    parsed.active = Number.isInteger(parsed.active) && parsed.active >= 0 && parsed.active < labData.scenarios.length ? parsed.active : 0;
    parsed.complete = Array.isArray(parsed.complete) && parsed.complete.length === labData.scenarios.length ? parsed.complete : labData.scenarios.map(() => false);
    parsed.commands = Array.isArray(parsed.commands) && parsed.commands.length === labData.scenarios.length ? parsed.commands : blankCommands();
    parsed.commands = parsed.commands.map((items) => Array.isArray(items) ? items : []);
    parsed.progress = parsed.progress.map((value, index) => Number.isInteger(value)
      ? Math.max(0, Math.min(value, labData.scenarios[index].steps.length)) : 0);
    // Old completed steps have unknown assistance history; never call them independent.
    parsed.outcomes = labData.scenarios.map((scenario, index) => scenario.steps.map((_, step) => {
      if (step >= parsed.progress[index]) return null;
      const outcome = parsed.outcomes?.[index]?.[step];
      return ['independent', 'assisted', 'legacy'].includes(outcome) ? outcome : 'legacy';
    }));
    parsed.drafts = labData.scenarios.map((_, index) => typeof parsed.drafts?.[index] === 'string' ? parsed.drafts[index] : '');
    return parsed;
  } catch (err) {
    return defaultState();
  }
}
let state = loadState();
window.addEventListener('projects:progress-cleared', event => {
  if (event.detail.ids.includes(`CLIs/MacOS/`)) location.reload();
});
function saveState(){
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
    window.ProjectsProgress?.cli(storageKey, state);
    const notice = document.getElementById('cliStorageNotice');
    if (notice) notice.hidden = true;
  } catch (error) {
    let notice = document.getElementById('cliStorageNotice');
    if (!notice) {
      notice = document.createElement('p'); notice.id = 'cliStorageNotice';
      notice.setAttribute('role', 'status'); document.getElementById('app').before(notice);
    }
    label(notice, 'Progress cannot be saved in this browser. Keep this page open; reloading may discard your attempt.');
    notice.hidden = false;
  }
}
function sanitize(value){ return String(value).replace(/[&<>\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch])); }

  // Source keys survive language changes; display text never supplies identity.
  function label(element, source, params = {}) {
    element.dataset.learningSource = source;
    element.dataset.learningParams = JSON.stringify(params);
    element.classList.add('notranslate');
    element.setAttribute('translate', 'no');
    element.textContent = source.replace(/\{(\w+)\}/g, (match, key) => params[key] ?? match);
    window.ProjectsLearningLocale?.apply(element);
  }
  function localized(source, params = {}) {
    return `<span class="notranslate" translate="no" data-learning-source="${sanitize(source)}" data-learning-params="${sanitize(JSON.stringify(params))}">${sanitize(source.replace(/\{(\w+)\}/g, (match, key) => params[key] ?? match))}</span>`;
  }
  function applyLocale() { window.ProjectsLearningLocale?.apply(); }

function addLine(text, cls=''){
  const p = document.createElement('p');
  p.className = ('output-line ' + cls).trim();
  p.innerHTML = text;
  screen.appendChild(p);
  screen.scrollTop = screen.scrollHeight;
}
function currentPrompt(scenario, stepIndex){
  let prompt = scenario.initialPrompt || labData.prompt || '$';
  for (let index = 0; index < stepIndex; index += 1) {
    if (scenario.steps[index].promptAfter) prompt = scenario.steps[index].promptAfter;
  }
  return prompt;
}
function focusInput(){
  const input = document.getElementById('cmdInput');
  if (input) input.focus({preventScroll:true});
}
function addPromptInput(scenario, stepIndex){
  const wrap = document.createElement('label');
  wrap.className = 'prompt-line';
  wrap.innerHTML = `<span class="prompt-label">${sanitize(currentPrompt(scenario, stepIndex))}</span><input class="cmd-input" id="cmdInput" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" />`;
  screen.appendChild(wrap);
  const input = document.getElementById('cmdInput');
  input.value = state.drafts[state.active];
  input.addEventListener('input', () => { state.drafts[state.active] = input.value; saveState(); });
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      submitCommand();
    }
  });
  focusInput();
  screen.scrollTop = screen.scrollHeight;
}
function completionCounts(index){
  return state.outcomes[index].reduce((counts, outcome) => {
    if (outcome) counts[outcome] += 1;
    return counts;
  }, {independent: 0, assisted: 0, legacy: 0});
}
function completionSource(index){
  const counts = completionCounts(index);
  return counts.assisted ? 'Scenario complete with assistance.'
    : counts.legacy ? 'Scenario complete; earlier assistance history is unknown.' : 'Scenario complete.';
}
function completionSummary(index){
  const counts = completionCounts(index);
  return localized('Completed: {independent} independent, {assisted} assisted.', counts)
    + (counts.legacy ? ' ' + localized('{legacy} earlier steps have unknown assistance history.', counts) : '');
}
function confirmation(source){ return window.ProjectsLearningLocale?.message(source) ?? source; }
function renderScenarioList(){
  scenarioList.innerHTML = '';
  labData.scenarios.forEach((scenario, index) => {
    const btn = document.createElement('button');
    btn.className = 'scenario-btn' + (index === state.active ? ' active' : '');
    const counts = completionCounts(index);
    const done = state.complete[index] ? ' • ' + localized(counts.assisted ? 'Complete with assistance' : counts.legacy ? 'Complete; earlier assistance unknown' : 'Complete') : ' • ' + localized('{count}/{total} steps', {count: state.progress[index], total: scenario.steps.length});
    btn.innerHTML = `<strong>${localized(scenario.title)}</strong><small>${localized(scenario.summary)}${done}${state.progress[index] ? '<br>' + completionSummary(index) : ''}</small>`;
    btn.addEventListener('click', () => { state.active = index; saveState(); render(); if (mobileWorkspace.matches) scenarioGoal.scrollIntoView({block: 'center', behavior: 'instant'}); });
    scenarioList.appendChild(btn);
  });
}
function renderSteps(scenario){
  stepList.innerHTML = '';
  const currentIndex = state.progress[state.active];
  scenario.steps.forEach((step, index) => {
    const item = document.createElement('div');
    const status = index < currentIndex ? 'done' : index === currentIndex ? 'active' : '';
    item.className = ('step ' + status).trim();
    const outcome = state.outcomes[state.active][index];
    if (outcome) item.classList.add(outcome);
    const marker = outcome === 'assisted' ? '?' : outcome === 'legacy' ? '•' : index < currentIndex ? '✓' : String(index + 1).padStart(2, '0');
    item.innerHTML = `<span class="task-marker">${marker}</span><strong>${localized(step.target)}</strong>${outcome ? `<span class="step-result">${localized(outcome === 'assisted' ? 'Assisted — revealed' : outcome === 'legacy' ? 'Completed — previous version' : 'Independent')}</span>` : ''}`;
    stepList.appendChild(item);
  });
  taskProgress.textContent = `${Math.min(currentIndex, scenario.steps.length)} / ${scenario.steps.length}`;
  let summary = document.getElementById('completionSummary');
  if (!summary) {
    summary = document.createElement('p'); summary.id = 'completionSummary';
    summary.className = 'completion-summary'; summary.setAttribute('role', 'status');
    stepList.before(summary);
  }
  summary.innerHTML = completionSummary(state.active);
}
function renderTerminal(scenario){
  screen.innerHTML = '';
  scenario.steps.forEach((step, index) => {
    if (index < state.progress[state.active]) {
      const submitted = state.commands[state.active][index] || step.expected;
      addLine(`${sanitize(currentPrompt(scenario, index))} ${sanitize(submitted)}`, 'command-line');
      addLine(sanitize(step.output), 'sys');
    }
  });
  const currentIndex = state.progress[state.active];
  const current = scenario.steps[currentIndex];
  if (current) addPromptInput(scenario, currentIndex);
  else addLine(localized(completionSource(state.active)), completionCounts(state.active).assisted ? 'warn' : 'ok');
}
function renderScenarioHeader(scenario){
  label(scenarioTitle, scenario.title);
  const currentIndex = state.progress[state.active];
  label(scenarioCounter, currentIndex >= scenario.steps.length ? '{current} / {total}' : 'Step {current} / {total}', {current: Math.min(currentIndex + 1, scenario.steps.length), total: scenario.steps.length});
  const current = scenario.steps[currentIndex];
  label(scenarioGoal, current ? current.target : completionSource(state.active));
}
function render(){
  const scenario = labData.scenarios[state.active];
  renderScenarioList();
  renderScenarioHeader(scenario);
  renderSteps(scenario);
  renderTerminal(scenario);
  applyLocale();
}
function normalize(value){
  let result = String(value || '')
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .trim()
    .replace(/;\s*$/, '')
    .replace(/\s*\|\s*/g, ' | ')
    .replace(/\s+/g, ' ');
  if (labData.caseInsensitive) result = result.toLowerCase();
  return result;
}
function commandMatches(value, step){
  const entered = normalize(value);
  const accepted = Array.isArray(step.accepted) && step.accepted.length ? step.accepted : [step.expected];
  if (accepted.some(candidate => entered === normalize(candidate))) return true;
  const flags = labData.caseInsensitive ? 'i' : '';
  return (step.acceptedPatterns || []).some(pattern => {
    try { return new RegExp(pattern, flags).test(String(value).trim()); }
    catch (err) { return false; }
  });
}
function completeCurrentStep(command, forceReveal=false){
  const scenario = labData.scenarios[state.active];
  const stepIndex = state.progress[state.active];
  const step = scenario.steps[stepIndex];
  if (!step) return;
  state.commands[state.active][stepIndex] = command || step.expected;
  state.outcomes[state.active][stepIndex] = forceReveal ? 'assisted' : 'independent';
  state.drafts[state.active] = '';
  state.progress[state.active] += 1;
  if (state.progress[state.active] >= scenario.steps.length) state.complete[state.active] = true;
  saveState();
  render();
}
function submitCommand(){
  const input = document.getElementById('cmdInput');
  if (!input) return;
  const rawValue = input.value || '';
  const value = rawValue.trim();
  if (!value) return;
  const scenario = labData.scenarios[state.active];
  const stepIndex = state.progress[state.active];
  const step = scenario.steps[stepIndex];
  if (commandMatches(value, step)) {
    completeCurrentStep(value, false);
    return;
  }
  const promptRow = input.closest('.prompt-line');
  if (promptRow) promptRow.remove();
  addLine(`${sanitize(currentPrompt(scenario, stepIndex))} ${sanitize(value)}`, 'command-line');
  addLine(localized('Command not accepted for this task. Check the task or use Hint.'), 'bad');
  applyLocale();
  addPromptInput(scenario, stepIndex);
}
terminal.addEventListener('pointerdown', (event) => {
  if (event.target.closest('button, input')) return;
  event.preventDefault();
  focusInput();
});
terminal.addEventListener('click', (event) => {
  if (event.target.closest('button')) return;
  focusInput();
});
document.getElementById('hintBtn').addEventListener('click', () => {
  const scenario = labData.scenarios[state.active];
  const step = scenario.steps[state.progress[state.active]];
  if (!step) return;
  addLine(`${localized('Hint:')} ${localized(step.hint)}`, 'warn');
  applyLocale();
  focusInput();
});
document.getElementById('revealBtn').addEventListener('click', () => {
  const scenario = labData.scenarios[state.active];
  const step = scenario.steps[state.progress[state.active]];
  if (!step) return;
  completeCurrentStep(step.expected, true);
});
document.getElementById('resetScenarioBtn').addEventListener('click', () => {
  if (!window.confirm(confirmation('Reset this scenario? Completed steps and unfinished command input will be cleared.'))) return;
  state.progress[state.active] = 0;
  state.complete[state.active] = false;
  state.commands[state.active] = [];
  state.outcomes[state.active] = labData.scenarios[state.active].steps.map(() => null);
  state.drafts[state.active] = '';
  saveState();
  render();
});
document.getElementById('resetAllBtn').addEventListener('click', () => {
  if (!window.confirm(confirmation('Reset all scenarios? All completed steps and unfinished command input will be cleared.'))) return;
  state = defaultState();
  saveState();
  render();
});
window.addEventListener('projects:learning-language-ready', applyLocale);
for (const [id, source] of Object.entries({hintBtn: 'Hint', revealBtn: 'Reveal and advance (assisted)', resetScenarioBtn: 'Reset scenario', resetAllBtn: 'Reset all'})) label(document.getElementById(id), source);
document.querySelectorAll('.current-task > span,.task-heading h2,.scenario-panel h2').forEach(element => label(element, element.textContent));
// Move existing panels, not their contents, so visual and DOM reading order agree.
const mobileWorkspace = window.matchMedia('(max-width: 780px)');
function arrangeWorkspace(){
  const app = document.getElementById('app');
  const terminalPanel = app.querySelector('.terminal-wrap');
  const scenarios = app.querySelector('.scenario-panel');
  const tasks = app.querySelector('.task-panel');
  const focused = document.activeElement;
  const selection = focused === document.getElementById('cmdInput')
    ? [focused.selectionStart, focused.selectionEnd] : null;
  const order = mobileWorkspace.matches ? [terminalPanel, tasks, scenarios] : [scenarios, terminalPanel, tasks];
  order.forEach((panel, index) => { if (app.children[index] !== panel) app.insertBefore(panel, app.children[index] || null); });
  if (focused && app.contains(focused)) {
    focused.focus({preventScroll: true});
    if (selection) focused.setSelectionRange(...selection);
  }
}
mobileWorkspace.addEventListener('change', arrangeWorkspace);
arrangeWorkspace();
render();
</script>
</body>
