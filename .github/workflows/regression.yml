name: Static site regression

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: Fast static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-static.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements-static.txt
      - name: Syntax, links, catalog, design contract and CI policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/static
          python -X utf8 tests/check_source.py | tee test-results/static/source.log
          python -X utf8 tests/check_learning_catalog.py | tee test-results/static/catalog.log
          python -X utf8 tests/build_progress_catalog.py --check
          python -X utf8 tests/check_design_system.py
          python -X utf8 tests/check_study_cleanup.py
          python -X utf8 tests/build_study_navigation.py --check
          python -X utf8 tests/check_ci.py
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
      - name: Static failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-failure
          path: test-results/static/*.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [ux_regression, language_regression, mobile_accessibility, navigation_directory, assessment_experience, progress_resume, learning_navigation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tests/requirements-static.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Deterministic local HTTP regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/${{ matrix.suite }}
          python -X utf8 tests/${{ matrix.suite }}.py --output test-results/${{ matrix.suite }} 2>&1 | tee test-results/${{ matrix.suite }}/run.log
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.suite }}-failure
          path: |
            test-results/${{ matrix.suite }}/**/*.json
            test-results/${{ matrix.suite }}/**/*.png
            test-results/${{ matrix.suite }}/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Same-runner base/head visual comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tests/requirements-static.txt
      - run: python -m pip install -r tests/requirements.txt
      # These visual suites use Playwright's default headless-shell executable.
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Compare unchanged site visuals and validate simplified learning navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/visual
          git worktree add --detach "$RUNNER_TEMP/design-before" "$(git merge-base HEAD origin/main)"
          python -X utf8 tests/design_visual.py --site-root "$RUNNER_TEMP/design-before" --exclude-case linux-hub --exclude-case ceh-hub --output test-results/visual/before 2>&1 | tee test-results/visual/before.log
          python -X utf8 tests/design_visual.py --exclude-case linux-hub --exclude-case ceh-hub --output test-results/visual/after --baseline test-results/visual/before 2>&1 | tee test-results/visual/after.log
          python -X utf8 tests/learning_navigation.py --before --site-root "$RUNNER_TEMP/design-before" --output test-results/visual/study-before 2>&1 | tee test-results/visual/study-before.log
          python -X utf8 tests/learning_navigation.py --capture-only --output test-results/visual/study-after --baseline test-results/visual/study-before 2>&1 | tee test-results/visual/study-after.log
          python -X utf8 tests/study_layout.py --output test-results/visual/study-interactions 2>&1 | tee test-results/visual/study-interactions.log
      - name: Visual failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-comparison-failure
          path: |
            test-results/visual/**/*.json
            test-results/visual/**/*.png
            test-results/visual/*.log
          if-no-files-found: ignore
          retention-days: 7
